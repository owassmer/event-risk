<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Event risk for a sample portfolio</title>
<link rel="preload" href="web/fonts/Geist.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="web/fonts/GeistMono.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="web/style.css">
<link rel="stylesheet" href="replay.css">
</head>
<body>
<div id="app" class="empty">
  <header id="topbar">
    <div id="tb-left">
      <div id="menu">
        <button type="button" id="menu-button" aria-haspopup="true" aria-expanded="false" title="Portfolio menu">
          <span class="brand-mark" aria-hidden="true"></span>
          <span id="ws-name">New portfolio</span>
          <svg class="chev-sm" viewBox="0 0 16 16" aria-hidden="true"><path d="m4.5 6.5 3.5 3.5 3.5-3.5"/></svg>
        </button>
        <div id="menu-pop" role="menu" hidden>
          <button type="button" role="menuitem" data-menu="new">New portfolio</button>
          <button type="button" role="menuitem" data-menu="open">Open conversation…</button>
          <button type="button" role="menuitem" data-menu="download">Download ledger</button>
          <div id="stores" hidden></div>
        </div>
      </div>

      <div id="tb-metrics" hidden>
        <span class="tb-div" aria-hidden="true"></span>
        <div class="tb-stat">
          <span class="tb-lab">Portfolio</span>
          <span id="tb-total" class="tb-val">—</span>
        </div>
        <div class="tb-stat" id="tb-move-wrap" hidden>
          <span class="tb-lab">Today</span>
          <span id="tb-move" class="tb-val"></span>
        </div>
        <div class="tb-stat" id="tb-vol-wrap" hidden>
          <span class="tb-lab">Volatility</span>
          <a id="tb-vol" class="tb-val go" data-go="x:portfolio_volatility:portfolio"></a>
        </div>
        <span id="tb-asof" class="tb-asof"></span>
      </div>
    </div>

    <div id="tb-right">
      <span id="tb-badge" class="tb-pill" hidden></span>
      <button type="button" id="tb-export" class="tb-btn" hidden title="Download ledger">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3.5v9m0 0-3.5-3.5M10 12.5 13.5 9M4.5 15.5h11"/></svg>
        <span>Download ledger</span>
      </button>
      <button type="button" id="toggle-chat" class="tb-btn active" aria-pressed="true" title="Toggle analyst (⌘/)">
        <span id="tb-chat-dot" class="dot" aria-hidden="true"></span>
        <span>Analyst</span>
      </button>
    </div>
  </header>

  <aside id="right" class="panel" aria-label="Events and portfolio">
    <div id="stage-bar">
      <nav id="stage-tabs" role="tablist" aria-label="Views">
        <button type="button" role="tab" id="tab-events" data-stage="events" aria-selected="true">
          <span>Events</span>
          <span id="ev-count" class="tab-badge" hidden></span>
        </button>
        <button type="button" role="tab" id="tab-matrix" data-stage="matrix" aria-selected="false">
          <span>By holding</span>
        </button>
        <button type="button" role="tab" id="tab-portfolio" data-stage="portfolio" aria-selected="false">
          <span>Portfolio</span>
        </button>
      </nav>
    </div>

    <div id="stage-body">
      <div id="pane-events" class="stage-pane">
        <div id="ledger-wrap" class="panel-scroll">
          <div id="ledger" tabindex="-1"></div>
          <div id="ledger-empty" class="stage-empty" hidden>
            <div class="empty-card">
              <span class="wait" aria-hidden="true"></span>
              <div>
                <strong>Finding events</strong>
                <p>Portfolio priced. Events appear here as the analyst works.</p>
              </div>
            </div>
          </div>
        </div>

        <div id="event-split" hidden>
          <aside id="event-rail" aria-label="Events">
            <div class="rail-head">
              <button type="button" id="all-events" class="rail-back">
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12 5 7 10l5 5"/></svg>
                <span>All events</span>
              </button>
              <span id="rail-count" class="rail-meta"></span>
            </div>
            <div id="event-rail-list" class="rail-scroll"></div>
          </aside>

          <div id="event-main">
            <div id="event-bar">
              <div id="trail" hidden>
                <button type="button" id="back" class="linkish">
                  <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12 5 7 10l5 5"/></svg>Back
                </button>
              </div>
            </div>
            <div id="event-stage" class="panel-scroll">
              <div id="event-bg" hidden></div>
              <div id="detail" tabindex="-1" hidden></div>
            </div>
          </div>
        </div>
      </div>

      <div id="pane-matrix" class="stage-pane panel-scroll" hidden>
        <div id="matrix"></div>
      </div>

      <div id="pane-portfolio" class="stage-pane panel-scroll" hidden>
        <div id="portfolio"></div>
      </div>

      <aside id="inspector" aria-label="Details" hidden>
        <div id="inspector-head">
          <button type="button" id="close-inspector" class="icon sm" title="Close (Esc)" aria-label="Close">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5.5 5.5 14.5 14.5M14.5 5.5 5.5 14.5"/></svg>
          </button>
        </div>
        <div id="inspector-scroll" class="panel-scroll"></div>
      </aside>
    </div>
  </aside>

  <main id="center" aria-label="Analyst conversation">
    <div id="chat-head">
      <div class="chat-title">
        <span id="chat-dot" class="dot" aria-hidden="true"></span>
        <span>Analyst</span>
      </div>
      <button type="button" id="collapse-chat" class="icon sm" title="Hide analyst (⌘/)" aria-label="Hide analyst">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 5 12.5 10l-5 5"/></svg>
      </button>
    </div>

    <div id="toggles" hidden>
      <button type="button" class="toggle" data-toggle="left" hidden>Portfolio</button>
      <button type="button" class="toggle" data-toggle="right" hidden>Events</button>
    </div>

    <div id="scroll">
      <div id="welcome">
        <h1>What could move your portfolio?</h1>
        <p class="w-sub">Paste holdings or attach a statement.</p>
      </div>
      <div id="conversation" aria-live="polite"></div>
      <div id="waiting"></div>
      <div id="notice"></div>
    </div>

    <div id="status" role="status" aria-live="polite" hidden></div>
    <form id="composer" autocomplete="off">
      <div id="keys"></div>
      <div id="attachments"></div>
      <textarea id="input" rows="1" placeholder="Paste holdings or attach a statement" aria-label="Message"></textarea>
      <div class="bar">
        <label class="icon attach" title="Attach a file">
          <input type="file" id="file" multiple accept=".pdf,.png,.jpg,.jpeg,.gif,.webp,.csv,.txt,.tsv,.md,.json" hidden>
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M13.5 6.5 7.8 12.2a1.6 1.6 0 0 0 2.3 2.3l6-6a3.2 3.2 0 0 0-4.6-4.6l-6 6a4.8 4.8 0 0 0 6.8 6.8l5.2-5.2"/></svg>
        </label>
        <span class="spacer"></span>
        <button type="button" id="stop" class="icon round" title="Stop" hidden>
          <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="6" y="6" width="8" height="8" rx="1.5"/></svg>
        </button>
        <button type="submit" id="send" class="icon round dark" title="Send" disabled>
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 15.5v-11M5.5 9 10 4.5 14.5 9"/></svg>
        </button>
      </div>
    </form>
  </main>
</div>
<div id="drop" hidden><div>Drop to attach</div></div>
<script>window.SITE_REPO = "https://github.com/owassmer/event-risk"; window.SITE_BY = "Owen Wassmer";</script>
<script src="static.js"></script>
<script src="web/app.js"></script>
<script src="replay.js"></script>
</body>
</html>
